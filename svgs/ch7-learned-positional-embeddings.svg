<svg width="760" height="640" viewBox="0 0 760 640"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Songti SC','Noto Serif SC','STSong',serif">

  <!-- 纸面底色 -->
  <rect width="760" height="640" fill="#fbfaf6"/>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8a887e"/>
    </marker>
  </defs>

  <!-- ==================== 总标题 ==================== -->
  <text x="380" y="46" text-anchor="middle"
        font-size="21" fill="#4a4a42" letter-spacing="6">位置编码的两种形态</text>
  <line x1="330" y1="60" x2="430" y2="60" stroke="#c9c6ba" stroke-width="1"/>

  <!-- ==================== 上：正余弦位置编码 ==================== -->
  <text x="380" y="106" text-anchor="middle" font-size="16" fill="#8c6f6c" letter-spacing="3">
    正余弦位置编码（原 Transformer，2017）
  </text>

  <!-- 公式 -->
  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#9a8f8c"
        font-family="'Times New Roman',serif" font-style="italic">
    PE(t, 2i) = sin( t / 10000^(2i/d) )&#160;&#160;&#160;&#160;PE(t, 2i+1) = cos( t / 10000^(2i/d) )
  </text>

  <!-- 波形图区 -->
  <line x1="150" y1="200" x2="610" y2="200" stroke="#ddd9cc" stroke-width="1"/>
  <line x1="150" y1="178" x2="610" y2="178" stroke="#e9e6da" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="150" y1="222" x2="610" y2="222" stroke="#e9e6da" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 低频波（一条完整的慢正弦） -->
  <path d="M 150 200
           Q 190 148 230 200
           Q 270 252 310 200
           Q 350 156 390 200
           Q 430 244 470 200
           Q 510 162 550 200
           Q 590 238 610 210"
        fill="none" stroke="#c49a95" stroke-width="1.6"/>

  <!-- 高频波（更快的正弦） -->
  <path d="M 150 200
           Q 162 176 174 200 Q 186 224 198 200
           Q 210 180 222 200 Q 234 220 246 200
           Q 258 182 270 200 Q 282 218 294 200
           Q 306 184 318 200 Q 330 216 342 200
           Q 354 186 366 200 Q 378 214 390 200
           Q 402 188 414 200 Q 426 212 438 200
           Q 450 190 462 200 Q 474 210 486 200
           Q 498 192 510 200 Q 522 208 534 200
           Q 546 194 558 200 Q 570 206 582 200
           Q 594 196 606 202"
        fill="none" stroke="#a5a294" stroke-width="1.1"/>

  <text x="380" y="254" text-anchor="middle" font-size="12.5" fill="#8c6f6c">
    多频率正交波 —— 任意位置的编码由公式直接算出，输出恒在 [-1, 1]
  </text>
  <text x="380" y="280" text-anchor="middle" font-size="12.5" fill="#9a8f8c">
    零参数 · 理论可外推 · 量级固定（须配 √d 缩放）
  </text>

  <!-- 分隔 -->
  <line x1="120" y1="312" x2="640" y2="312" stroke="#ddd9cc" stroke-width="1"/>
  <path d="M 380 306 l 6 6 l -6 6 l -6 -6 z" fill="#c9c6ba"/>

  <!-- ==================== 下：可学习位置编码 ==================== -->
  <text x="380" y="356" text-anchor="middle" font-size="16" fill="#6e8276" letter-spacing="3">
    可学习位置编码（GPT-2 / GPT-3）
  </text>

  <!-- 查找表 -->
  <text x="200" y="394" text-anchor="middle" font-size="12" fill="#6a8272"
        font-family="'Menlo','Consolas',monospace">wpe（查找表）</text>

  <rect x="170" y="404" width="60" height="28" rx="3" fill="#ecf2ec" stroke="#9db4a4" stroke-width="1.1"/>
  <text x="200" y="423" text-anchor="middle" font-size="11.5" fill="#5c7362">pos 0</text>
  <rect x="170" y="434" width="60" height="28" rx="3" fill="#f3f1ea" stroke="#a5a294" stroke-width="1.1"/>
  <text x="200" y="453" text-anchor="middle" font-size="11.5" fill="#5c7362">pos 1</text>
  <rect x="170" y="464" width="60" height="28" rx="3" fill="#ecf2ec" stroke="#9db4a4" stroke-width="1.1"/>
  <text x="200" y="483" text-anchor="middle" font-size="11.5" fill="#5c7362">pos 2</text>
  <rect x="170" y="494" width="60" height="20" rx="3" fill="#f3f1ea" stroke="#a5a294" stroke-width="1.1"/>
  <text x="200" y="509" text-anchor="middle" font-size="11.5" fill="#5c7362">⋮</text>
  <rect x="170" y="516" width="60" height="28" rx="3" fill="#ecf2ec" stroke="#9db4a4" stroke-width="1.1"/>
  <text x="200" y="535" text-anchor="middle" font-size="11.5" fill="#5c7362">pos 2047</text>

  <!-- 每行 → 一个可学习向量 -->
  <line x1="230" y1="418" x2="268" y2="418" stroke="#8a887e" stroke-width="1.1" marker-end="url(#arw)"/>
  <line x1="230" y1="448" x2="268" y2="448" stroke="#8a887e" stroke-width="1.1" marker-end="url(#arw)"/>
  <line x1="230" y1="478" x2="268" y2="478" stroke="#8a887e" stroke-width="1.1" marker-end="url(#arw)"/>
  <line x1="230" y1="530" x2="268" y2="530" stroke="#8a887e" stroke-width="1.1" marker-end="url(#arw)"/>

  <!-- 向量格子示意 -->
  <g>
    <rect x="274" y="410" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="288" y="410" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="302" y="410" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="316" y="410" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <text x="340" y="423" font-size="11" fill="#6e8276">…</text>
    <text x="360" y="423" font-size="11" fill="#6e8276" font-family="'Menlo',monospace">d_model 维</text>
  </g>
  <g>
    <rect x="274" y="440" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="288" y="440" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="302" y="440" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="316" y="440" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
  </g>
  <g>
    <rect x="274" y="470" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="288" y="470" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="302" y="470" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="316" y="470" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
  </g>
  <g>
    <rect x="274" y="522" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="288" y="522" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
    <rect x="302" y="522" width="12" height="16" rx="2" fill="#f3f1ea" stroke="#a5a294" stroke-width="0.8"/>
    <rect x="316" y="522" width="12" height="16" rx="2" fill="#ecf2ec" stroke="#9db4a4" stroke-width="0.8"/>
  </g>

  <!-- 词嵌入 + 相加节点 -->
  <rect x="274" y="560" width="96" height="26" rx="3" fill="#f3f1ea" stroke="#a5a294" stroke-width="1"/>
  <text x="322" y="577" text-anchor="middle" font-size="12" fill="#5a584e">词嵌入 wte</text>
  <line x1="370" y1="573" x2="447" y2="500" stroke="#8a887e" stroke-width="1.1" marker-end="url(#arw)"/>

  <circle cx="465" cy="486" r="15" fill="#fbfaf6" stroke="#8a887e" stroke-width="1.3"/>
  <text x="465" y="492" text-anchor="middle" font-size="16" fill="#5a584e">+</text>
  <line x1="360" y1="486" x2="448" y2="486" stroke="#8a887e" stroke-width="1.2" marker-end="url(#arw)"/>

  <!-- 输出 -->
  <line x1="480" y1="486" x2="540" y2="486" stroke="#8a887e" stroke-width="1.2" marker-end="url(#arw)"/>
  <text x="548" y="491" font-size="12.5" fill="#6a685e">输入网络</text>

  <!-- 特性注释 -->
  <text x="565" y="420" text-anchor="middle" font-size="12" fill="#6e8276">
    参数表 n_ctx × d_model
  </text>
  <text x="565" y="444" text-anchor="middle" font-size="12" fill="#6e8276">
    （GPT-3：2048 × 12288）
  </text>
  <text x="565" y="468" text-anchor="middle" font-size="12" fill="#6e8276">
    量级自由 · 不需 √d 缩放
  </text>
  <text x="565" y="530" text-anchor="middle" font-size="12" fill="#8c6f6c">
    硬上限：第 2049 个位置
  </text>
  <text x="565" y="548" text-anchor="middle" font-size="12" fill="#8c6f6c">
    无向量可查
  </text>

  <!-- 底注 -->
  <text x="380" y="618" text-anchor="middle" font-size="13" fill="#9a968a" letter-spacing="2">
    前者以公式换外推，后者以参数换拟合
  </text>
</svg>

