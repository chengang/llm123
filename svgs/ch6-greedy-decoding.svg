<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a5a"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#51cf66"/>
      <stop offset="100%" style="stop-color:#40c057"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="700" height="520" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">贪婪解码 vs 全局最优</text>
  
  <!-- 起始节点 -->
  <circle cx="100" cy="260" r="25" fill="#4dabf7" stroke="#228be6" stroke-width="2"/>
  <text x="100" y="265" text-anchor="middle" font-size="14" fill="white" font-weight="bold">Start</text>
  
  <!-- t=1 标签 -->
  <text x="200" y="130" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">t=1</text>
  
  <!-- w_A 节点 (贪婪选择) -->
  <rect x="175" y="170" width="70" height="45" rx="8" fill="url(#redGrad)" stroke="#c92a2a" stroke-width="2"/>
  <text x="210" y="197" text-anchor="middle" font-size="16" fill="white" font-weight="bold">w_A</text>
  <text x="210" y="240" text-anchor="middle" font-size="13" fill="#c92a2a" font-weight="bold">P=0.6 ✓</text>
  
  <!-- w_B 节点 -->
  <rect x="175" y="310" width="70" height="45" rx="8" fill="url(#greenGrad)" stroke="#2f9e44" stroke-width="2"/>
  <text x="210" y="337" text-anchor="middle" font-size="16" fill="white" font-weight="bold">w_B</text>
  <text x="210" y="380" text-anchor="middle" font-size="13" fill="#2f9e44">P=0.4</text>
  
  <!-- t=2 标签 -->
  <text x="350" y="130" text-anchor="middle" font-size="14" fill="#666" font-weight="bold">t=2</text>
  
  <!-- w_2 节点 (来自w_A) -->
  <rect x="325" y="170" width="70" height="45" rx="8" fill="#ffdee0" stroke="#e03131" stroke-width="1.5"/>
  <text x="360" y="197" text-anchor="middle" font-size="16" fill="#c92a2a" font-weight="bold">w_2</text>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#888">max P=0.1</text>
  
  <!-- w_2' 节点 (来自w_B) -->
  <rect x="325" y="310" width="70" height="45" rx="8" fill="#d3f9d8" stroke="#37b24d" stroke-width="1.5"/>
  <text x="360" y="337" text-anchor="middle" font-size="16" fill="#2f9e44" font-weight="bold">w'_2</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#888">max P=0.9</text>
  
  <!-- 连接线 -->
  <!-- Start -> w_A -->
  <path d="M125,250 L170,195" stroke="#e03131" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <!-- Start -> w_B -->
  <path d="M125,270 L170,325" stroke="#40c057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- w_A -> w_2 -->
  <path d="M245,192 L320,192" stroke="#e03131" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <!-- w_B -> w_2' -->
  <path d="M245,332 L320,332" stroke="#40c057" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 最终结果框 -->
  <rect x="450" y="150" width="220" height="120" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="560" y="175" text-anchor="middle" font-size="14" fill="#c92a2a" font-weight="bold">❌ 贪婪路径 (局部最优)</text>
  <text x="560" y="200" text-anchor="middle" font-size="13" fill="#333">序列: (w_A, w_2)</text>
  <text x="560" y="225" text-anchor="middle" font-size="13" fill="#333">P = 0.6 × 0.1 =</text>
  <text x="560" y="255" text-anchor="middle" font-size="20" fill="#c92a2a" font-weight="bold">0.06</text>
  
  <rect x="450" y="290" width="220" height="120" rx="10" fill="#ebfbee" stroke="#37b24d" stroke-width="2"/>
  <text x="560" y="315" text-anchor="middle" font-size="14" fill="#2f9e44" font-weight="bold">✓ 全局最优路径</text>
  <text x="560" y="340" text-anchor="middle" font-size="13" fill="#333">序列: (w_B, w'_2)</text>
  <text x="560" y="365" text-anchor="middle" font-size="13" fill="#333">P = 0.4 × 0.9 =</text>
  <text x="560" y="395" text-anchor="middle" font-size="20" fill="#2f9e44" font-weight="bold">0.36</text>
  
  <!-- 比较符号 -->
  <text x="560" y="440" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0.06 &lt; 0.36</text>
  
  <!-- 结论框 -->
  <rect x="150" y="450" width="400" height="55" rx="8" fill="#fff3bf" stroke="#fab005" stroke-width="2"/>
  <text x="350" y="475" text-anchor="middle" font-size="14" fill="#333">⚠️ 贪婪解码选择了初始概率高的 w_A</text>
  <text x="350" y="495" text-anchor="middle" font-size="14" fill="#333">但最终联合概率反而更低！局部最优 ≠ 全局最优</text>
  
  <!-- 说明箭头 -->
  <path d="M400,210 L445,210" stroke="#e03131" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M400,350 L445,350" stroke="#40c057" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>

