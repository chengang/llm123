<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <style>
      .bg { fill: #f9f9f9; }
      .axis { stroke: #333; stroke-width: 1.5; }
      .circle { stroke: #444; stroke-width: 2.5; fill: none; }
      .rad-line { stroke: #333; stroke-width: 2; }
      .cos-line { stroke: #d32f2f; stroke-width: 4; }
      .sin-line { stroke: #1976d2; stroke-width: 4; }
      .angle-arc { stroke: #f57c00; stroke-width: 2.5; fill: none; }
      .angle-text { fill: #e65100; font-family: sans-serif; font-size: 22px; font-weight: bold; }
      .label { font-family: sans-serif; font-size: 20px; font-weight: bold; }
      .label-small { font-family: sans-serif; font-size: 18px; }
      .right-angle { stroke: #888; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="500" height="500" class="bg"/>

  <!-- 坐标轴 -->
  <line x1="40" y1="250" x2="460" y2="250" class="axis" marker-end="url(#arrow)"/>
  <text x="468" y="265" class="label-small">x</text>
  <line x1="250" y1="460" x2="250" y2="40" class="axis" marker-end="url(#arrow)"/>
  <text x="260" y="40" class="label-small">y</text>

  <!-- 原点 O -->
  <text x="230" y="270" class="label-small">O</text>

  <!-- 单位圆（半径 180，圆心 250,250） -->
  <circle cx="250" cy="250" r="180" class="circle"/>

  <!-- 角度 θ 的半径（斜边） -->
  <!-- 取 θ ≈ 45°，坐标约为 (377.3, 122.7) -->
  <line x1="250" y1="250" x2="377.3" y2="122.7" class="rad-line"/>

  <!-- 圆上的点 P -->
  <circle cx="377.3" cy="122.7" r="7" fill="#000"/>
  <text x="385" y="115" class="label">P</text>

  <!-- ============ 最重要的部分：cos 和 sin 的线段 ============ -->
  
  <!-- 红色线段：cos(θ) —— 从原点到 P 点的垂足（水平方向） -->
  <!-- 垂足在 x 轴上的点 (377.3, 250) -->
  <line x1="250" y1="250" x2="377.3" y2="250" class="cos-line"/>
  <!-- 标注文字 -->
  <text x="300" y="240" fill="#d32f2f" class="label">cos(θ)</text>

  <!-- 蓝色线段：sin(θ) —— 从 P 点到 x 轴的垂直距离 -->
  <!-- 从 (377.3, 122.7) 到 (377.3, 250) -->
  <line x1="377.3" y1="122.7" x2="377.3" y2="250" class="sin-line"/>
  <!-- 标注文字 -->
  <text x="388" y="195" fill="#1976d2" class="label">sin(θ)</text>

  <!-- 直角小方块（在垂足处） -->
  <polyline points="363,250 363,237 377.3,237" class="right-angle"/>

  <!-- 半径长度标注（斜边 = 1） -->
  <text x="290" y="160" fill="#000" class="label">r = 1</text>

  <!-- 角度弧（0° 到 45°，半径 50） -->
  <path d="M 300 250 A 50 50 0 0 0 285.36 214.64" class="angle-arc"/>
  <!-- 角度标注 -->
  <text x="280" y="230" class="angle-text">θ</text>

  <!-- 图例 -->
  <rect x="20" y="20" width="200" height="80" fill="white" stroke="#ccc"/>
  <line x1="35" y1="42" x2="70" y2="42" class="cos-line"/>
  <text x="80" y="48" class="label-small">cos(θ) = 横坐标</text>
  <line x1="35" y1="68" x2="70" y2="68" class="sin-line"/>
  <text x="80" y="74" class="label-small">sin(θ) = 纵坐标</text>
</svg>
